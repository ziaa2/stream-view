<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tahta Dapur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e6eee8; --card:#fbfdfb; --line:#c4d3c9; --text:#1c2a24; --mute:#5b6f64;
  --gold:#c98f00; --gold-bg:#fff4cf; --new:#d8452f; --new-fg:#fff; --ok:#1f7a5a; --btn:#1f7a5a; --btn-fg:#fff;
  --shadow:0 2px 0 rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b2a25; --card:#243630; --line:#3b5148; --text:#f1eee3; --mute:#a9bbb1;
    --gold:#f2c14e; --gold-bg:#3a3420; --new:#ee6a53; --new-fg:#1b2a25; --ok:#8fd3b6; --btn:#8fd3b6; --btn-fg:#1b2a25;
    --shadow:0 2px 0 rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1b2a25; --card:#243630; --line:#3b5148; --text:#f1eee3; --mute:#a9bbb1;
  --gold:#f2c14e; --gold-bg:#3a3420; --new:#ee6a53; --new-fg:#1b2a25; --ok:#8fd3b6; --btn:#8fd3b6; --btn-fg:#1b2a25;
  --shadow:0 2px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1,h2,.brush{font-family:"Caveat Brush","Comic Sans MS",cursive;font-weight:400;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.avatar{position:relative;width:84px;height:84px;flex:none;border-radius:50%;border:3px solid var(--gold);background:var(--card);cursor:pointer;padding:0;overflow:visible}
.avatar:disabled{cursor:default}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar .ph{display:grid;place-items:center;height:100%;font-size:12px;color:var(--mute);text-align:center;padding:8px;line-height:1.2}
.avatar .ph.big{font-size:34px}
.avatar .crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:28px}
.head h1{margin:0;font-size:34px;line-height:1.05}
.head input.nm{background:none;border:0;border-bottom:2px dashed var(--line);font-size:15px;color:var(--mute);width:100%;padding:2px 0}
.nmro{color:var(--mute);font-size:15px}
.share{flex:none;align-self:flex-start}

.chart{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 12px 10px;margin-bottom:14px}
.chart h2{margin:0 0 4px;font-size:22px}
.cols{display:flex;gap:8px;height:250px}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.col .track{flex:1;display:flex;align-items:flex-end;border-bottom:2px solid var(--line);padding-top:44px}
.col .fill{position:relative;width:100%;height:0;border-radius:10px 10px 0 0;background:var(--ok);transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col.first .fill{background:linear-gradient(180deg,#f2c14e,#c98f00)}
.fill .val{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-weight:800;font-size:14px;padding-bottom:2px;line-height:1.2}
.col.first .val{color:var(--gold);font-size:17px}
.fill .cr{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:24px;line-height:1;margin-bottom:22px}
.fill .rk{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:"Caveat Brush",cursive;font-size:24px;color:var(--btn-fg)}
.col.first .rk{color:#1b2a25}
.cn{height:34px;margin-top:5px;font-size:12px;line-height:1.25;text-align:center;overflow:hidden;font-weight:600;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.col .fill{transition:none}}

.throne{border:3px solid var(--gold);background:var(--gold-bg);border-radius:18px;padding:18px 16px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.throne .tag{font-family:"Caveat Brush",cursive;font-size:22px;color:var(--gold)}
.throne .row{display:flex;gap:14px;align-items:center;margin-top:6px}
.throne img.food{width:96px;height:96px;object-fit:cover;border-radius:12px;flex:none}
.throne .nomf{width:96px;height:96px;border-radius:12px;border:2px dashed var(--gold);display:grid;place-items:center;font-size:40px;flex:none}
.throne h2{margin:0;font-size:32px;line-height:1.05}
.score{font-weight:800;font-size:15px}
.score b{font-size:26px;color:var(--gold)}
.note{color:var(--mute);font-size:14px;margin:4px 0 0}
.empty{color:var(--mute);text-align:center;padding:10px 0}
.hist{margin:0 0 22px;font-size:13px;color:var(--mute)}
.hist summary{cursor:pointer;padding:4px 0}
.hist ul{margin:6px 0 0;padding-left:18px}

.form{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:22px}
.form h2{margin:0 0 10px;font-size:24px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--mute)}
.f input[type=text],.f input[type=password],.f textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.f textarea{resize:vertical;min-height:56px}
.f input[type=range]{width:100%;accent-color:var(--gold)}
.sc{display:flex;justify-content:space-between;align-items:baseline}
.sc output{font-weight:800;font-size:22px;color:var(--gold)}
.pic{display:flex;gap:10px;align-items:center}
.pic img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--text);border:2px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:600}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.item.champ{border-color:var(--gold)}
.rank{font-family:"Caveat Brush",cursive;font-size:26px;width:30px;text-align:center;color:var(--mute);flex:none}
.item img.food{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:800;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--mute)}
.item .s{font-weight:800;font-size:20px;flex:none}
.lbl{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.lbl.new{background:var(--new);color:var(--new-fg)}
.lbl.gold{background:var(--gold);color:#1b2a25}
.lbl.fav{border:2px solid var(--ok);color:var(--ok);padding:0 8px}
.acts{display:flex;gap:6px;margin-top:6px}

.banner{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);z-index:10;padding:20px}
.banner.on{display:grid}
.banner .box{background:var(--card);border:4px solid var(--gold);border-radius:20px;padding:26px 22px;text-align:center;max-width:360px;width:100%;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.banner .big{font-size:64px;line-height:1}
.banner h2{font-size:32px;margin:6px 0}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.banner .box{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.foot{margin-top:26px;font-size:12px;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main>
  <div class="head">
    <button class="avatar" id="avatarBtn" aria-label="Foto istri"></button>
    <div style="flex:1;min-width:0">
      <h1>Tahta Dapur</h1>
      <input class="nm" id="chefName" type="text" maxlength="30" placeholder="Nama istri (ketuk untuk isi)" aria-label="Nama istri" hidden>
      <div class="nmro" id="chefNameRO"></div>
    </div>
    <button class="btn ghost sm share" id="shareBtn">Bagikan</button>
  </div>
  <input class="vh" id="avatarFile" type="file" accept="image/*" aria-label="Pilih foto istri">

  <section class="chart" id="chart" aria-label="Grafik peringkat masakan" hidden></section>
  <section id="throne" aria-live="polite"></section>
  <details class="hist" id="hist" hidden></details>

  <section class="form" id="syncCard" hidden>
    <h2>Belum diunggah ke GitHub</h2>
    <p style="font-size:14px;margin:0 0 10px">Perubahanmu baru ada di HP ini. Unduh data.json, lalu upload ke repo GitHub (ganti file lama) supaya istri bisa lihat.</p>
    <div class="btns"><button class="btn" id="dlBtn">Unduh data.json</button><button class="btn ghost" id="cpBtn">Salin data</button><button class="btn ghost" id="dropBtn">Buang perubahan</button></div>
  </section>

  <section class="form" id="formCard" hidden>
    <h2 id="formTitle">Menu baru</h2>
    <label class="f"><span>Nama masakan</span><input type="text" id="mName" maxlength="40" placeholder="contoh: Rendang sapi"></label>
    <label class="f"><span class="sc"><span>Nilai</span><output id="mOut">8.0</output></span><input type="range" id="mScore" min="1" max="10" step="0.5" value="8"></label>
    <label class="f"><span>Komentar (boleh kosong)</span><textarea id="mNote" maxlength="120" placeholder="contoh: bumbunya meresap banget"></textarea></label>
    <div class="f"><span>Foto masakan (boleh kosong)</span>
      <div class="pic"><img id="mPrev" alt="" hidden><button type="button" class="btn ghost sm" id="mPicBtn">Pilih foto</button></div>
      <input class="vh" id="mFile" type="file" accept="image/*" aria-label="Pilih foto masakan">
    </div>
    <div class="btns"><button class="btn" id="saveBtn">Tambah menu</button><button class="btn ghost" id="cancelBtn" hidden>Batal</button></div>
  </section>

  <h2 style="font-size:26px;margin:0 0 10px">Peringkat</h2>
  <ul class="list" id="list"></ul>

  <p class="foot" id="foot"></p>
</main>

<div class="banner" id="banner" role="dialog" aria-modal="true"><div class="box">
  <div class="big">👑</div>
  <h2 id="bnTitle"></h2>
  <p id="bnText" style="margin:0 0 14px"></p>
  <button class="btn" id="bnClose">Siap, lanjut</button>
</div></div>

<div class="banner" id="dlg" role="dialog" aria-modal="true"><div class="box" style="border-color:var(--line)">
  <p id="dlgText" style="margin:0 0 16px;font-weight:600;overflow-wrap:anywhere"></p>
  <div class="btns" style="justify-content:center"><button class="btn" id="dlgOk">Ya</button><button class="btn ghost" id="dlgNo">Batal</button></div>
</div></div>

<div class="banner" id="login" role="dialog" aria-modal="true"><div class="box" style="border-color:var(--line);text-align:left">
  <h2 style="margin-top:0">Masuk pemilik</h2>
  <label class="f"><span>PIN pemilik</span><input type="password" id="lgPin" inputmode="numeric" autocomplete="off"></label>
  <p id="lgErr" style="color:var(--new);font-size:13px;margin:0 0 10px" hidden>PIN salah, coba lagi.</p>
  <div class="btns"><button class="btn" id="lgOk">Masuk</button><button class="btn ghost" id="lgNo">Batal</button></div>
</div></div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var NEW_DAYS=3, KEY_SEEN='tahta-seen', KEY_CFG='tahta-cfg';
  function $(id){return document.getElementById(id)}
  var S={chef:{name:'',photo:null},menus:[],history:[]};
  var loading=true, loadFail=false, pending=0, saving=Promise.resolve(), editId=null, mPhoto=null;

  /* ---------- mode pemilik (PIN, ganti sesukamu) ---------- */
  var PIN='1234', KEY_ADMIN='tahta-admin', KEY_DRAFT='tahta-draft';
  var admin=false;try{admin=localStorage.getItem(KEY_ADMIN)==='1'}catch(e){}
  var PUB=null, dirty=false;
  function canWrite(){return admin}

  /* ---------- util ---------- */
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function ranked(){return S.menus.slice().sort(function(a,b){return b.score-a.score||a.created-b.created})}
  function champ(){var r=ranked();return r[0]||null}
  function fmt(n){return Number(n).toFixed(1)}
  function dayStr(ts){return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function norm(d){
    d=(d&&typeof d==='object')?d:{};
    d.chef=d.chef||{name:'',photo:null};d.menus=d.menus||[];d.history=d.history||[];
    return d;
  }
  function describe(e){
    if(!e.from)return e.to+' ('+fmt(e.score)+') naik jadi juara pertama';
    if(e.gone)return e.from+' dihapus, tahta turun ke '+e.to+' ('+fmt(e.score)+')';
    return e.to+' ('+fmt(e.score)+') merebut tahta dari '+e.from;
  }
  function b64(str){
    var b=new TextEncoder().encode(str),s='',i;
    for(i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
    return btoa(s);
  }

  var tt;
  function toast(m,keep){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);if(!keep)tt=setTimeout(function(){t.hidden=true},3800)}
  var askRes=null;
  function ask(msg,ok){return new Promise(function(res){askRes=res;$('dlgText').textContent=msg;$('dlgOk').textContent=ok||'Ya, hapus';$('dlgNo').hidden=false;$('dlg').classList.add('on');$('dlgNo').focus()})}
  function info(msg){askRes=null;$('dlgText').textContent=msg;$('dlgOk').textContent='Tutup';$('dlgNo').hidden=true;$('dlg').classList.add('on');$('dlgOk').focus()}
  function closeAsk(v){$('dlg').classList.remove('on');if(askRes){askRes(v);askRes=null}}
  $('dlgOk').onclick=function(){closeAsk(true)};
  $('dlgNo').onclick=function(){closeAsk(false)};

  function resize(file,max,cb){
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var k=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',.78));
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* ---------- baca & simpan data ---------- */
  function loadDraft(){try{var r=localStorage.getItem(KEY_DRAFT);if(r)return norm(JSON.parse(r))}catch(e){}return null}
  function fetchPublished(){
    return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('gagal');return r.json()});
  }
  function calcDirty(){
    var d=admin?loadDraft():null;
    dirty=!!(d&&(!PUB||JSON.stringify(d)!==JSON.stringify(PUB)));
  }
  function refresh(){
    return fetchPublished().then(function(d){PUB=norm(d)}).catch(function(){PUB=null}).then(function(){
      var dr=admin?loadDraft():null;
      if(dr){S=dr;loadFail=false}
      else if(PUB){S=PUB;loadFail=false}
      else{S=norm(null);loadFail=true}
      loading=false;calcDirty();render();showPending();
    });
  }
  function save(){
    if(!canWrite())return;
    try{localStorage.setItem(KEY_DRAFT,JSON.stringify(S))}catch(e){toast('Penyimpanan HP penuh. Hapus beberapa foto atau menu.');return}
    calcDirty();renderControls();
    toast('Tersimpan di HP ini. Unduh data.json lalu upload ke GitHub biar istri bisa lihat.');
  }
  $('dlBtn').onclick=function(){
    var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
    toast('data.json terunduh. Upload ke repo, ganti file lama.');
  };
  $('cpBtn').onclick=function(){
    var t=JSON.stringify(S);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast('Data disalin. Tempel ke data.json di GitHub.')}).catch(function(){toast('Gagal menyalin, pakai tombol Unduh.')});
    }else toast('Gagal menyalin, pakai tombol Unduh.');
  };
  $('dropBtn').onclick=function(){
    ask('Buang perubahan di HP ini dan kembali ke data yang ada di GitHub?','Ya, buang').then(function(ok){
      if(!ok)return;
      try{localStorage.removeItem(KEY_DRAFT)}catch(e){}
      S=PUB?norm(JSON.parse(JSON.stringify(PUB))):norm(null);
      resetForm();calcDirty();render();
    });
  };

  /* ---------- render ---------- */
  function renderHead(){
    var w=canWrite();
    var b=$('avatarBtn');b.textContent='';
    b.appendChild(el('span','crown','👑'));
    if(S.chef.photo){var i=el('img');i.src=S.chef.photo;i.alt='Foto istri';b.appendChild(i)}
    else{b.appendChild(w?el('span','ph','Taruh foto istri'):el('span','ph big','🍳'))}
    b.disabled=!w;
    $('chefName').hidden=!w;
    if(w)$('chefName').value=S.chef.name||'';
    $('chefNameRO').hidden=w||!S.chef.name;
    $('chefNameRO').textContent=S.chef.name?('Masakan '+S.chef.name):'';
  }
  function renderChart(){
    var c=$('chart');c.textContent='';
    var r=ranked().slice(0,6);
    if(loading||!r.length){c.hidden=true;return}
    c.hidden=false;
    c.appendChild(el('h2','','Papan peringkat'));
    var cols=el('div','cols');
    r.forEach(function(m,i){
      var col=el('div','col'+(i===0?' first':''));
      var track=el('div','track');
      var fill=el('div','fill');
      if(i===0)fill.appendChild(el('div','cr','\uD83D\uDC51'));
      fill.appendChild(el('div','val',fmt(m.score)));
      fill.appendChild(el('span','rk',String(i+1)));
      track.appendChild(fill);col.appendChild(track);
      col.appendChild(el('div','cn',m.name));
      cols.appendChild(col);
      requestAnimationFrame(function(){requestAnimationFrame(function(){fill.style.height=(m.score*8.5)+'%'})});
    });
    c.appendChild(cols);
  }
  function renderThrone(){
    var t=$('throne');t.textContent='';
    var box=el('div','throne');
    box.appendChild(el('div','tag','👑 Tahta pertama'));
    if(loading){box.appendChild(el('p','empty','Memuat...'));t.appendChild(box);return}
    if(loadFail){box.appendChild(el('p','empty','Data belum bisa dimuat. Cek koneksi lalu muat ulang halaman.'));t.appendChild(box);return}
    var c=champ();
    if(!c){box.appendChild(el('p','empty',canWrite()?'Belum ada menu. Tambah menu pertama, dia langsung duduk di tahta.':'Belum ada menu. Tunggu masakan pertama masuk papan ini.'));t.appendChild(box);return}
    var row=el('div','row');
    if(c.photo){var i=el('img','food');i.src=c.photo;i.alt=c.name;row.appendChild(i)}else{row.appendChild(el('div','nomf','🍲'))}
    var txt=el('div');
    txt.appendChild(el('h2','',c.name));
    var sc=el('div','score');sc.appendChild(el('b','',fmt(c.score)));sc.appendChild(document.createTextNode(' / 10'));
    txt.appendChild(sc);
    if(c.note)txt.appendChild(el('p','note','"'+c.note+'"'));
    row.appendChild(txt);box.appendChild(row);
    t.appendChild(box);
  }
  function renderHist(){
    var h=$('hist');h.textContent='';
    if(loading||!S.history.length){h.hidden=true;return}
    h.hidden=false;
    h.appendChild(el('summary','','Riwayat pergantian tahta ('+S.history.length+')'));
    var ul=el('ul');
    S.history.slice().reverse().forEach(function(e){ul.appendChild(el('li','',dayStr(e.ts)+': '+describe(e)))});
    h.appendChild(ul);
  }
  function renderList(){
    var ul=$('list');ul.textContent='';
    var r=ranked();
    if(loading||!r.length){ul.appendChild(el('li','empty',loading?'':'Daftar masih kosong.'));return}
    var w=canWrite();
    r.forEach(function(m,idx){
      var li=el('li','item'+(idx===0?' champ':''));
      li.appendChild(el('div','rank',idx===0?'👑':String(idx+1)));
      if(m.photo){var i=el('img','food');i.src=m.photo;i.alt='';li.appendChild(i)}
      var mid=el('div','mid');
      var t=el('div','t',m.name);
      if(idx===0)t.appendChild(el('span','lbl gold','Juara'));
      if(Date.now()-m.created<NEW_DAYS*86400000)t.appendChild(el('span','lbl new','BARU'));
      else if(m.score>=9)t.appendChild(el('span','lbl fav','Favorit'));
      mid.appendChild(t);
      mid.appendChild(el('div','meta','Dicoba '+dayStr(m.created)+(m.note?' · '+m.note:'')));
      if(w){
        var a=el('div','acts');
        var e=el('button','btn ghost sm','Ubah');e.onclick=function(){startEdit(m.id)};
        var d=el('button','btn ghost sm','Hapus');d.onclick=function(){del(m.id)};
        a.appendChild(e);a.appendChild(d);mid.appendChild(a);
      }
      li.appendChild(mid);
      li.appendChild(el('div','s',fmt(m.score)));
      ul.appendChild(li);
    });
  }
  function renderControls(){
    var w=canWrite();
    $('formCard').hidden=!w;
    $('syncCard').hidden=!(w&&dirty);
    var f=$('foot');f.textContent='';
    var b=el('button','',w?'Mode pemilik aktif. Keluar':'Masuk pemilik');
    b.onclick=w?logout:openLogin;
    f.appendChild(b);
  }
  function render(){renderHead();renderChart();renderThrone();renderHist();renderList();renderControls()}

  /* ---------- tahta ---------- */
  function afterChange(prev){
    var now=champ();
    if(now&&(!prev||now.id!==prev.id)){
      var gone=!!prev&&!S.menus.some(function(m){return m.id===prev.id});
      S.history.push({ts:Date.now(),to:now.name,from:prev?prev.name:null,score:now.score,gone:gone});
      if(S.history.length>40)S.history=S.history.slice(-40);
    }
    render();showPending();save();
  }
  function showPending(){
    var h=S.history[S.history.length-1];if(!h)return;
    var seen=0;try{seen=+localStorage.getItem(KEY_SEEN)||0}catch(e){}
    if(h.ts>seen&&Date.now()-h.ts<7*86400000&&!$('banner').classList.contains('on')){
      $('bnTitle').textContent=!h.from?'Juara pertama!':(h.gone?'Ganti juara':'Tahta berpindah!');
      $('bnText').textContent=describe(h)+'.';
      $('banner').classList.add('on');$('bnClose').focus();
    }
  }
  $('bnClose').onclick=function(){
    $('banner').classList.remove('on');
    var h=S.history[S.history.length-1];
    try{if(h)localStorage.setItem(KEY_SEEN,String(h.ts))}catch(e){}
  };

  /* ---------- form ---------- */
  function resetForm(){
    editId=null;mPhoto=null;
    $('mName').value='';$('mNote').value='';$('mScore').value=8;$('mOut').textContent='8.0';
    $('mPrev').hidden=true;$('formTitle').textContent='Menu baru';
    $('saveBtn').textContent='Tambah menu';$('cancelBtn').hidden=true;
  }
  function startEdit(id){
    var m=S.menus.filter(function(x){return x.id===id})[0];if(!m)return;
    editId=id;mPhoto=m.photo;
    $('mName').value=m.name;$('mNote').value=m.note||'';$('mScore').value=m.score;$('mOut').textContent=fmt(m.score);
    if(m.photo){$('mPrev').src=m.photo;$('mPrev').hidden=false}else{$('mPrev').hidden=true}
    $('formTitle').textContent='Ubah menu';$('saveBtn').textContent='Simpan perubahan';$('cancelBtn').hidden=false;
    $('formCard').scrollIntoView({behavior:'smooth',block:'start'});$('mName').focus();
  }
  function del(id){
    var m=S.menus.filter(function(x){return x.id===id})[0];if(!m)return;
    ask('Hapus "'+m.name+'"?').then(function(ok){
      if(!ok)return;
      var prev=champ();
      S.menus=S.menus.filter(function(x){return x.id!==id});
      if(editId===id)resetForm();
      afterChange(prev);
    });
  }
  $('mScore').oninput=function(){$('mOut').textContent=fmt(this.value)};
  $('mPicBtn').onclick=function(){$('mFile').click()};
  $('mFile').onchange=function(){
    var f=this.files[0];if(!f)return;
    resize(f,560,function(d){mPhoto=d;$('mPrev').src=d;$('mPrev').hidden=false});
    this.value='';
  };
  $('saveBtn').onclick=function(){
    if(!canWrite())return;
    var name=$('mName').value.trim();
    if(!name){$('mName').focus();toast('Isi nama masakan dulu.');return}
    var score=parseFloat($('mScore').value),note=$('mNote').value.trim();
    var prev=champ();
    if(editId){
      var m=S.menus.filter(function(x){return x.id===editId})[0];
      m.name=name;m.score=score;m.note=note;m.photo=mPhoto;
    }else{
      S.menus.push({id:uid(),name:name,score:score,note:note,photo:mPhoto,created:Date.now()});
    }
    resetForm();afterChange(prev);
  };
  $('cancelBtn').onclick=resetForm;

  /* ---------- istri ---------- */
  $('avatarBtn').onclick=function(){if(canWrite())$('avatarFile').click()};
  $('avatarFile').onchange=function(){
    var f=this.files[0];if(!f)return;
    resize(f,320,function(d){S.chef.photo=d;renderHead();save()});
    this.value='';
  };
  $('chefName').onchange=function(){S.chef.name=this.value.trim();save()};

  /* ---------- bagikan ---------- */
  function copyLink(url){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){toast('Link disalin. Tinggal tempel ke chat istri.')}).catch(function(){info('Salin link ini lalu kirim ke istri: '+url)});
    }else info('Salin link ini lalu kirim ke istri: '+url);
  }
  $('shareBtn').onclick=function(){
    var url=location.origin+location.pathname;
    if(navigator.share){
      navigator.share({title:'Tahta Dapur',text:'Lihat papan peringkat masakan di Tahta Dapur',url:url}).catch(function(e){if(!(e&&e.name==='AbortError'))copyLink(url)});
    }else copyLink(url);
  };

  /* ---------- masuk pemilik ---------- */
  function openLogin(){$('lgPin').value='';$('lgErr').hidden=true;$('login').classList.add('on');$('lgPin').focus()}
  function tryLogin(){
    if($('lgPin').value.trim()!==PIN){$('lgErr').hidden=false;return}
    admin=true;try{localStorage.setItem(KEY_ADMIN,'1')}catch(e){}
    $('login').classList.remove('on');refresh();toast('Masuk sebagai pemilik.');
  }
  $('lgOk').onclick=tryLogin;
  $('lgNo').onclick=function(){$('login').classList.remove('on')};
  $('lgPin').onkeydown=function(e){if(e.key==='Enter')tryLogin()};
  function logout(){
    admin=false;try{localStorage.removeItem(KEY_ADMIN)}catch(e){}
    resetForm();dirty=false;refresh();toast('Sudah keluar dari mode pemilik.');
  }

  /* ---------- mulai ---------- */
  render();
  refresh();
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!pending)refresh()});
})();
</script>
</body>
</html>
